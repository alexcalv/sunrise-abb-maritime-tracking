stitch_name: motion_bbox_v1

tracklets:
  split_gap: 1
  min_length: 1

memory:
  max_frame_gap: 900

appearance:
  backend: none
  enabled: false
  sample_frames: 5
  params: {}

motion:
  enabled: true
  max_frame_gap: 900
  max_center_distance: 300.0
  base_region_radius: 100.0
  growth_per_frame: 1.25

bbox:
  enabled: true
  max_area_ratio: 2.5
  max_aspect_ratio_delta: 0.5

matching:
  min_match_score: 0.55
  min_score_margin: 0.05
  min_mean_confidence: 0.55
  min_tracklet_length: 20
  weights:
    temporal: 0.15
    motion: 0.2
    center: 0.15
    area: 0.2
    aspect: 0.15
    confidence: 0.15
    ais_position: 0.0
    ais_identity: 0.0

# Optional AIS augmentation for stitching (disabled by default; core path unchanged).
ais:
  enabled: false
  file_path: null
  video_fps: null
  time_offset_ms: 0
  geo_affine: null
  max_distance_px: 400.0
  hard_identity_gate: false
  neutral_score: 0.5
