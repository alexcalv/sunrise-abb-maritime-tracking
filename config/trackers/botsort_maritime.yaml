tracker_type: botsort

# Slightly relaxed defaults so custom / maritime exports still obtain track IDs when conf is borderline.
track_high_thresh: 0.20
track_low_thresh: 0.08
new_track_thresh: 0.20
track_buffer: 30
match_thresh: 0.75
fuse_score: true

# BoT-SORT specifics
gmc_method: sparseOptFlow
proximity_thresh: 0.50
appearance_thresh: 0.25
with_reid: false
model: auto