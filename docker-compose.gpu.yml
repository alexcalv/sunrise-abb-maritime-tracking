services:
  worker:
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
      CUDA_VISIBLE_DEVICES: "0"
      YOLO_DEVICE: "0"

  runner:
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
      CUDA_VISIBLE_DEVICES: "0"
      YOLO_DEVICE: "0"
