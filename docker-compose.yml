services:
  redis:
    image: redis:7-alpine
    container_name: maritime-redis
    ports:
      - "6379:6379"

  worker:
    build: .
    image: maritime-tracker:consolidated
    container_name: maritime-worker
    entrypoint: [
      "celery", "-A", "worker.tasks", "worker",
      "--loglevel=INFO",
      "--pool=solo",
      "--concurrency=1",
      "-Q", "celery"
    ]
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      YOLO_MODEL: yolo26l.pt
      YOLO_DEVICE: "0"
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      WORKER_RESULTS_DIR: /workspace/outputs/worker_results
      FRAMES_DIR: /workspace/outputs/frames
      AGGREGATED_DIR: /workspace/outputs/aggregated
    depends_on:
      - redis
    volumes:
      - ./data:/workspace/data
      - ./outputs:/workspace/outputs
      - ./outputs_v2:/workspace/outputs_v2
      - ./config:/workspace/config
      - ./models:/workspace/models

  runner:
    build: .
    image: maritime-tracker:consolidated
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      YOLO_MODEL: yolo26l.pt
      YOLO_DEVICE: auto
      WORKER_RESULTS_DIR: /workspace/outputs/worker_results
      FRAMES_DIR: /workspace/outputs/frames
      AGGREGATED_DIR: /workspace/outputs/aggregated
    depends_on:
      - redis
    volumes:
      - ./app:/workspace/app
      - ./data:/workspace/data
      - ./outputs:/workspace/outputs
      - ./outputs_v2:/workspace/outputs_v2
      - ./config:/workspace/config
      - ./models:/workspace/models
      - ./tests:/workspace/tests

  # Unit tests (image ENTRYPOINT is scripts.cli; this service overrides to plain python).
  test:
    build: .
    image: maritime-tracker:consolidated
    entrypoint: ["python", "-m", "unittest"]
    command: ["discover", "-s", "/workspace/tests", "-p", "test*.py", "-v"]
    environment:
      PYTHONPATH: /workspace/app
    volumes:
      - ./app:/workspace/app
      - ./tests:/workspace/tests
